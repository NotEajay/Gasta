# GasTa Supabase local development config
# https://supabase.com/docs/guides/cli/config

project_id = "gasta"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

# Keep the platform JWT check enabled for signed-in user calls. The handler
# also validates the session so auth failures use the DirectionsError contract.
[functions.google-directions]
verify_jwt = true

# Location search and reverse lookup use the same server-side key and auth gate.
[functions.google-geocode]
verify_jwt = true

# Places Autocomplete uses the same server-side key and auth gate.
[functions.google-places-autocomplete]
verify_jwt = true
