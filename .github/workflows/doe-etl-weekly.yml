# Weekly DOE fuel price ETL — runs automatically after DOE publishes bulletins.
# Manual run: GitHub → Actions → DOE Weekly ETL → Run workflow

name: DOE Weekly ETL

on:
  schedule:
    # Every Wednesday 02:00 UTC (10:00 PH) — after typical DOE weekly posting
    - cron: "0 2 * * 3"
  workflow_dispatch:

jobs:
  sync-ncr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Sync latest DOE bulletins (all regions) to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run.py sync-all
