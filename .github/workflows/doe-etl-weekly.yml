# Weekly DOE fuel price ETL — keeps the app showing the current week's prices.
# Manual run: GitHub → Actions → DOE Weekly ETL → Run workflow

name: DOE Weekly ETL

on:
  schedule:
    # Tuesday only (PH). DOE bulletin weeks start Tuesday; multiple slots cover
    # late uploads the same day. A region already stored for that week is skipped.
    - cron: "0 22 * * 1" # Tuesday 06:00 PH (Monday UTC)
    - cron: "0 1 * * 2" # Tuesday 09:00 PH
    - cron: "0 4 * * 2" # Tuesday 12:00 PH
    - cron: "0 6 * * 2" # Tuesday 14:00 PH
    - cron: "0 11 * * 2" # Tuesday 19:00 PH
    - cron: "0 15 * * 2" # Tuesday 23:00 PH
    # TEMP test slots — 30 Sep 2026 only (16:05–16:20 PH = 08:05–08:20 UTC).

  workflow_dispatch:
    inputs:
      force:
        description: "Reload the week even if it is already stored"
        type: boolean
        default: false

concurrency:
  group: doe-etl
  cancel-in-progress: false

jobs:
  sync-all:
    name: Sync latest bulletins (all regions)
    runs-on: ubuntu-latest
    # OCR of scanned North Luzon (and similar) PDFs can exceed a short timeout.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest DOE bulletins to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_TRIGGER: github-actions
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python run.py sync-all ${{ inputs.force && '--force' || '' }}
