# Weekly DOE fuel price ETL — keeps the app showing the current week's prices.
# Manual run: GitHub → Actions → DOE Weekly ETL → Run workflow

name: DOE Weekly ETL

on:
  schedule:
    # DOE bulletin weeks start Tuesday. Files often land late Tuesday or mid-week.
    # Extra Tuesday slots plus the daily catch-up keep the app on the newest week.
    # A region already stored for that week is skipped, so later runs are cheap no-ops.
    - cron: "0 22 * * 1" # Tuesday 06:00 PH (Monday UTC)
    - cron: "0 1 * * 2" # Tuesday 09:00 PH
    - cron: "0 4 * * 2" # Tuesday 12:00 PH
    - cron: "0 6 * * 2" # Tuesday 14:00 PH
    - cron: "0 11 * * 2" # Tuesday 19:00 PH
    - cron: "0 15 * * 2" # Tuesday 23:00 PH
    # Daily catch-up: DOE regularly uploads a week's bulletin several days late
    # (sometimes not until the following week), and lists it on the archive page
    # later still. Weeks already stored are skipped, so this is a cheap no-op
    # whenever there is nothing new.
    - cron: "0 3 * * 0,1,3,4,5,6" # 11:00 PH every day except Tuesday
  workflow_dispatch:
    inputs:
      force:
        description: "Reload the week even if it is already stored"
        type: boolean
        default: false

concurrency:
  group: doe-etl
  cancel-in-progress: false

jobs:
  sync-all:
    name: Sync latest bulletins (all regions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest DOE bulletins to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run.py sync-all ${{ inputs.force && '--force' || '' }}
