# Weekly DOE fuel price ETL — keeps the app showing the current week's prices.
# Manual run: GitHub → Actions → DOE Weekly ETL → Run workflow

name: DOE Weekly ETL

on:
  schedule:
    # DOE bulletin weeks start Tuesday and the files appear through Tuesday PH time.
    # Three attempts across the day catch both early and late publications; a region
    # already stored for that week is skipped, so later runs are cheap no-ops.
    - cron: "0 1 * * 2" # Tuesday 09:00 PH
    - cron: "0 6 * * 2" # Tuesday 14:00 PH
    - cron: "0 11 * * 2" # Tuesday 19:00 PH
    # Safety net for regions DOE publishes a day late.
    - cron: "0 2 * * 3" # Wednesday 10:00 PH
  workflow_dispatch:
    inputs:
      force:
        description: "Reload the week even if it is already stored"
        type: boolean
        default: false

concurrency:
  group: doe-etl
  cancel-in-progress: false

jobs:
  sync-all:
    name: Sync latest bulletins (all regions)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync latest DOE bulletins to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python run.py sync-all ${{ inputs.force && '--force' || '' }}
