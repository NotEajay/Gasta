# Daily retry of DOE PDFs that weekly sync could not download (e.g. Bicol 403).
# Idle when the pending queue is empty — no full sync-all.
# Manual run: GitHub → Actions → DOE Pending PDF Retry → Run workflow

name: DOE Pending PDF Retry

on:
  schedule:
    # Once daily mid-morning PH (22:00 UTC = 06:00 PH next calendar day in UTC+8
    # wait: 22 UTC = 6am PH same calendar day... Mon 22:00 UTC = Tue 06:00 PH.
    # Use 22:00 UTC daily = 06:00 Philippine time.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: doe-etl-pending
  cancel-in-progress: false

jobs:
  retry-pending:
    name: Retry pending DOE PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retry pending downloads only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_TRIGGER: pending-retry
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python run.py retry-pending
