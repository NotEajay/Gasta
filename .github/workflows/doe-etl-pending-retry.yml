# Daily retry of DOE PDFs that weekly sync could not download (e.g. Bicol 403).
# Idle (green) when the pending queue is empty. Still-403 fails the run (red)
# so the Actions UI shows the gap is still open; recovered clears the queue.
# Manual run: GitHub → Actions → DOE Pending PDF Retry → Run workflow

name: DOE Pending PDF Retry

on:
  schedule:
    # Once daily mid-morning PH (22:00 UTC = 06:00 PH next calendar day in UTC+8
    # wait: 22 UTC = 6am PH same calendar day... Mon 22:00 UTC = Tue 06:00 PH.
    # Use 22:00 UTC daily = 06:00 Philippine time.
    - cron: "0 22 * * *"
  workflow_dispatch:

concurrency:
  group: doe-etl-pending
  cancel-in-progress: false

jobs:
  retry-pending:
    name: Retry pending DOE PDFs
    runs-on: ubuntu-latest
    outputs:
      history_payload: ${{ steps.etl.outputs.history_payload }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install OCR system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr ghostscript

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retry pending downloads only
        id: etl
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_TRIGGER: pending-retry
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: python run.py retry-pending

  record-history:
    name: Record DOE Pending PDF Retry history
    needs: retry-pending
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download history reconciler
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/etl/record_workflow_run.py
        run: >-
          curl --fail --silent --show-error --location
          --header "Authorization: Bearer $GITHUB_TOKEN"
          "$SOURCE_URL" --output record_workflow_run.py

      - name: Reconcile workflow history
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ETL_HISTORY_PAYLOAD: ${{ needs.retry-pending.outputs.history_payload }}
        run: >-
          python record_workflow_run.py
          --workflow pending-retry
          --job-name "Retry pending DOE PDFs"
          --job-result "${{ needs.retry-pending.result }}"
