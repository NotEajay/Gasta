# Hourly RSS-first fuel-news import. Publisher article pages are not requested.
# Manual run: GitHub -> Actions -> Fuel News Import -> Run workflow

name: Fuel News Import

on:
  schedule:
    # Hourly at minute 17 UTC to avoid the busiest top-of-hour scheduler window.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuel-news-import
  cancel-in-progress: false

jobs:
  import:
    name: Import publisher RSS feeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Import fuel news from RSS
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.fuel_news
