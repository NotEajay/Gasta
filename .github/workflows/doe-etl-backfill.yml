# One-off / on-demand historical import of the DOE bulletin archive.
# Run this to populate price history; the weekly workflow only loads the current week.
# Manual run: GitHub → Actions → DOE ETL Backfill → Run workflow

name: DOE ETL Backfill

on:
  workflow_dispatch:
    inputs:
      region:
        description: "Region to backfill"
        type: choice
        default: all
        options:
          - all
          - ncr
          - north_luzon
          - south_luzon
          - visayas
          - mindanao
      since:
        description: "Earliest bulletin week, YYYY-MM-DD (blank = whole archive)"
        type: string
        default: ""
      dry_run:
        description: "Parse and report only, write nothing to Supabase"
        type: boolean
        default: false
      force:
        description: "Reload weeks already stored in Supabase"
        type: boolean
        default: false

concurrency:
  group: doe-etl
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill ${{ inputs.region }}
    runs-on: ubuntu-latest
    # South Luzon alone is ~200 PDFs; a full five-region archive parse takes a while.
    timeout-minutes: 350
    defaults:
      run:
        working-directory: etl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill DOE bulletin archive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python run.py backfill \
            --region "${{ inputs.region }}" \
            ${{ inputs.since && format('--since {0}', inputs.since) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            | tee backfill-report.txt

      - name: Upload backfill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-report-${{ inputs.region }}
          path: etl/backfill-report.txt
          if-no-files-found: warn
